          description: The window the number was computed over.
        as_of:
          type: string
          format: date
          title: As Of
          description: Point-in-time cutoff. No input to this number post-dates it.
        cost_convention:
          type: string
          title: Cost Convention
          description: 'Versioned cost + slippage convention applied, e.g. ''costs_v3: brokerage+STT+exchange+GST+stamp,
            slippage 10bps, entry next open''.'
        computed_by:
          type: string
          title: Computed By
          description: The DETERMINISTIC component that computed it, e.g. 'book_engine@2.3.1'. A model
            id must never appear here — the LLM does not compute.
        computed_at:
          type: string
          format: date-time
          title: Computed At
          description: IST timestamp of the computation.
        universe:
          anyOf:
          - type: string
          - type: 'null'
          title: Universe
          description: Point-in-time universe, e.g. 'nifty500_pit'.
        level:
          anyOf:
          - $ref: '#/components/schemas/EvidenceLevel'
          - type: 'null'
          description: 'S1: same_stock / peer_group / sector / whole_market — where this number''s evidence
            comes from.'
      additionalProperties: false
      type: object
      required:
      - data_source
      - date_range
      - as_of
      - cost_convention
      - computed_by
      - computed_at
      title: Provenance
      description: 'L-4 + L-5: where a number came from, and the `as_of` it was computed at.'
    RejectedCandidate:
      properties:
        finding_id:
          type: string
          pattern: ^fnd_[a-z0-9_]+$
          title: Finding Id
        edition_date:
          type: string
          format: date
          title: Edition Date
        template_id:
          type: string
          title: Template Id
        family:
          anyOf:
          - type: string
          - type: 'null'
          title: Family
        trials_evaluated:
          type: integer
          minimum: 0.0
          title: Trials Evaluated
        reason:
          type: string
          title: Reason
        best_rule_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Best Rule Text
          description: The variant that came closest to clearing (fewest failed gates).
        best_expectancy_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Best Expectancy Net Pct
          description: 'S2 re-audit N1: on the BOOK-selected population (the strategy the book trades),
            not every firing.'
        best_failed_gates:
          items:
            type: string
          type: array
          title: Best Failed Gates
          description: Its failed fatal gates as 'name=value vs bar'.
        family_trials_all_time:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Family Trials All Time
          description: 'S2 re-audit N4: the family''s trial count after this evaluation, across every
            finding and retry.'
      additionalProperties: false
      type: object
      required:
      - finding_id
      - edition_date
      - template_id
      - trials_evaluated
      - reason
      title: RejectedCandidate
      description: An S1 finding the gate did NOT open — on the record with its trial count and reason.
    Rulebook:
      properties:
        universe:
          type: string
          title: Universe
        direction:
          $ref: '#/components/schemas/Direction'
        entry:
          type: string
          title: Entry
          description: Signal condition. Fill = NEXT OPEN after the signal bar.
        invalidation:
          type: string
          title: Invalidation
          description: What makes the idea wrong. Replaces 'target price'.
        exit:
          type: string
          title: Exit
          description: 'Deterministic exit: stop / trail / horizon.'
        horizon_sessions:
          type: integer
          minimum: 1.0
          title: Horizon Sessions
        sizing:
          type: string
          title: Sizing
        cost_convention:
          type: string
          title: Cost Convention
      additionalProperties: false
      type: object
      required:
      - universe
      - direction
      - entry
      - invalidation
      - exit
      - horizon_sessions
      - sizing
      - cost_convention
      title: Rulebook
      description: The deterministic rule under test. No target price — invalidation instead.
    SampleFlag:
      type: string
      enum:
      - ok
      - flagged
      - greyed
      - unknown
      - not_applicable
      title: SampleFlag
    ScoreCounts:
      properties:
        right:
          type: integer
          minimum: 0.0
          title: Right
        wrong:
          type: integer
          minimum: 0.0
          title: Wrong
        inconclusive:
          type: integer
          minimum: 0.0
          title: Inconclusive
        n:
          type: integer
          minimum: 0.0
          title: N
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
      additionalProperties: false
      type: object
      required:
      - right
      - wrong
      - inconclusive
      - n
      title: ScoreCounts
    Scoreboard:
      properties:
        right:
          type: integer
          minimum: 0.0
          title: Right
        wrong:
          type: integer
          minimum: 0.0
          title: Wrong
        inconclusive:
          type: integer
          minimum: 0.0
          title: Inconclusive
        n:
          type: integer
          minimum: 0.0
          title: N
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
        pending:
          type: integer
          minimum: 0.0
          title: Pending
          description: Published findings whose horizon has not completed.
        by_template:
          additionalProperties:
            $ref: '#/components/schemas/ScoreCounts'
          type: object
          title: By Template
        as_of:
          type: string
          format: date
          title: As Of
        forward:
          $ref: '#/components/schemas/ScoreCounts'
          description: Grades on findings generated on their own session date.
        backfilled:
          $ref: '#/components/schemas/ScoreCounts'
          description: Grades on findings generated after the fact (simulated backfill).
        n_total:
          type: integer
          minimum: 0.0
          title: N Total
          description: Every Right / Wrong / Inconclusive grade row, including re-grades of the same claim.
        n_independent:
          type: integer
          minimum: 0.0
          title: N Independent
          description: Grades on distinct (claim, non-overlapping horizon) — equals n. A grade of a claim
            whose earlier grade's horizon was still running is folded into that earlier grade (S1 third
            audit N2).
        continued:
          type: integer
          minimum: 0.0
          title: Continued
          description: Continuation cards folded into an existing grade (not counted).
          default: 0
        regraded:
          type: integer
          minimum: 0.0
          title: Regraded
          description: 'Grade rows folded into an earlier, overlapping grade of the same claim: n_total
            - n.'
          default: 0
        void:
          type: integer
          minimum: 0.0
          title: Void
          description: Findings closed without a verdict because the outcome could not be measured (S1
            third audit N5). Not in n, not in n_total.
          default: 0
        record_label:
          type: string
          title: Record Label
          description: 'What this scoreboard is: a forward record, a backfill, or mixed.'
      additionalProperties: false
      type: object
      required:
      - right
      - wrong
      - inconclusive
      - n
      - pending
      - as_of
      - forward
      - backfilled
      - n_total
      - n_independent
      - record_label
      title: Scoreboard
      description: '`Right · Wrong · Inconclusive · n` — running, public, append-only underneath.


        S1 second audit A1/A2: the headline counts are INDEPENDENT grades (one per claim per

        non-overlapping horizon; continuations are graded through the finding they continue), split

        into `forward` (generated on the session date) and `backfilled` (simulated). `n_total` is

        every grade row including any re-grade of the same claim; `n` is the independent count.'
    Spark:
      properties:
        basis:
          type: string
          enum:
