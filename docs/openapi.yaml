      - record_label
      title: Scoreboard
      description: '`Right · Wrong · Inconclusive · n` — running, public, append-only underneath.


        S1 second audit A1/A2: the headline counts are INDEPENDENT grades (one per claim per

        non-overlapping horizon; continuations are graded through the finding they continue), split

        into `forward` (generated on the session date) and `backfilled` (simulated). `n_total` is

        every grade row including any re-grade of the same claim; `n` is the independent count.'
    Spark:
      properties:
        basis:
          type: string
          enum:
          - virtual_equity_pct
          - historical_equity_pct
          title: Basis
        points:
          items:
            type: number
          type: array
          maxItems: 400
          minItems: 2
          title: Points
        date_range:
          $ref: '#/components/schemas/DateRange'
        as_of:
          type: string
          format: date
          title: As Of
      additionalProperties: false
      type: object
      required:
      - basis
      - points
      - date_range
      - as_of
      title: Spark
      description: A sparkline series. Points are cumulative % to date — never a projection.
    StoryBeat:
      type: string
      enum:
      - noticed
      - hypothesis
      - experiment
      - outcome
      - learning
      - next
      title: StoryBeat
      description: The six beats of the living-research-loop story. Order is the UX law.
    StoryLine:
      properties:
        beat:
          $ref: '#/components/schemas/StoryBeat'
        headline:
          type: string
          title: Headline
        body:
          type: string
          title: Body
        produced_by:
          $ref: '#/components/schemas/Author'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Model id, when produced_by == 'llm' (e.g. 'claude-sonnet-5').
        prompt_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Version
        at:
          type: string
          format: date-time
          title: At
        fact_refs:
          items:
            type: string
          type: array
          title: Fact Refs
          description: Every fact id referenced in `body`/`headline`.
      additionalProperties: false
      type: object
      required:
      - beat
      - headline
      - body
      - produced_by
      - at
      title: StoryLine
      description: 'One beat of the loop story.


        L-8: if `produced_by == "llm"`, `headline` and `body` must contain no literal

        numerals — every number is a fact reference resolved by the client.'
    SubjectKind:
      type: string
      enum:
      - stock
      - sector
      - pair
      - market
      title: SubjectKind
    Tier:
      type: string
      enum:
      - what_matters_now
      - discovery
      title: Tier
    Trigger:
      properties:
        id:
          type: string
          pattern: ^trg_[a-z0-9_]+$
          title: Id
        type:
          $ref: '#/components/schemas/TriggerType'
        description:
          type: string
          title: Description
        fired_at:
          type: string
          format: date-time
          title: Fired At
        fired_by:
          type: string
          const: engine
          title: Fired By
          description: Only the deterministic observer fires a trigger — never a clock, never the LLM.
          default: engine
        fact_refs:
          items:
            type: string
          type: array
          title: Fact Refs
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - description
      - fired_at
      title: Trigger
      description: What woke the LLM up. Always fired by the deterministic observer.
    TriggerType:
      type: string
      enum:
      - unusual_market_condition
      - observation_threshold
      - performance_deviation
      - scheduled_review
      - human_request
      title: TriggerType
      description: Autonomy = continuous cheap observation, intelligent LLM activation.
    Unit:
      type: string
      enum:
      - pct
      - pct_per_trade
      - bps
      - count
      - ratio
      - days
      - sessions
      - x
      - inr
      - text
      title: Unit
    UsefulnessScore:
      properties:
        total:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Total
        evidence_strength:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Evidence Strength
        novelty:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Novelty
        trader_relevance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Trader Relevance
        magnitude:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Magnitude
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
        version:
          type: string
          title: Version
      additionalProperties: false
      type: object
      required:
      - total
      - evidence_strength
      - novelty
      - trader_relevance
      - magnitude
      - threshold
      - version
      title: UsefulnessScore
      description: Deterministic ranking components (research/ranking.py). The threshold gates publication.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Verdict:
      type: string
      enum:
      - right
      - wrong
      - inconclusive
      - void
      title: Verdict
    VirtualBook:
      properties:
        metrics:
          $ref: '#/components/schemas/PerformanceBlock'
        capital_inr:
          type: number
          exclusiveMinimum: 0.0
          title: Capital Inr
          description: Virtual capital. Never real money.
        ledger_losers_first:
          items:
            $ref: '#/components/schemas/VirtualTrade'
          type: array
          title: Ledger Losers First
          description: 'L-7: closed trades sorted ASCENDING by pnl_pct_net — worst first, always.'
        open_positions:
          items:
            $ref: '#/components/schemas/VirtualTrade'
          type: array
          title: Open Positions
      additionalProperties: false
      type: object
      required:
      - metrics
      - capital_inr
      - ledger_losers_first
      title: VirtualBook
    VirtualTrade:
      properties:
        id:
          type: string
          pattern: ^trd_[a-z0-9_]+$
          title: Id
        symbol:
          type: string
          title: Symbol
        direction:
          $ref: '#/components/schemas/Direction'
        signal_date:
          type: string
          format: date
          title: Signal Date
          description: Bar that produced the signal.
        entry_date:
          type: string
          format: date
          title: Entry Date
          description: Next session after signal_date.
        entry_price:
          type: number
          exclusiveMinimum: 0.0
          title: Entry Price
          description: Adjusted open of entry_date.
        exit_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Exit Date
        exit_price:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Exit Price
        exit_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Exit Reason
          description: stop | trail | horizon | invalidation | open
        holding_sessions:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Holding Sessions
        pnl_pct_gross:
          anyOf:
          - type: number
          - type: 'null'
          title: Pnl Pct Gross
        pnl_pct_net:
          anyOf:
          - type: number
          - type: 'null'
          title: Pnl Pct Net
          description: After the stated cost convention. The ledger sorts on this.
        costs_pct:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Costs Pct
        slippage_bps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Slippage Bps
        mfe_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Mfe Pct
        mae_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Mae Pct
        as_of:
          type: string
          format: date
          title: As Of
      additionalProperties: false
      type: object
      required:
      - id
      - symbol
      - direction
      - signal_date
      - entry_date
      - entry_price
      - as_of
      title: VirtualTrade
      description: One virtual trade. Entry = next open after the signal bar (quant law).
tags:
- name: Pathfinder
  description: 'The autonomous research loop: an LLM research brain around a deterministic quant engine.
    Read-only. Pathfinder emits research, never an order.'
