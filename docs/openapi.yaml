openapi: 3.1.0
info:
  title: KANIDA.AI API
  version: 0.1.0
  description: 'The KANIDA.AI product contract — the seam between the engine track and the app track.


    Product laws that are enforced *in the schemas*, not merely documented:

    - **Expectancy is the hero metric**; `win_rate_pct` is optional and never the headline.

    - **Every return is paired with its drawdown** — a performance block cannot exist without `max_drawdown_pct`
    and `current_drawdown_pct`.

    - **No return promises and no target prices** — there is deliberately no target, projection or expected-return
    field anywhere in this contract.

    - **Every number carries n + date range + data source + cost convention** via `Provenance`; `sample_flag`
    is derived (`greyed` below n=20, `flagged` below n=50).

    - **Point-in-time is law** — every `Provenance` carries an `as_of`.

    - **Losers first** — ledgers are named `ledger_losers_first` and sorted ascending by net P&L.

    - **Backtests are labelled** ''Simulated · Not traded · Not PaRRVA-verified''.

    - **The LLM never calculates** — narrative text authored by a model contains no literal numerals,
    only `{{fact:<id>}}` references resolved against `facts[]`.'
paths:
  /api/pathfinder/experiment/{experiment_id}:
    get:
      tags:
      - Pathfinder
      summary: One experiment's full journey
      description: '**S2 (`KANIDA_PATHFINDER_SOURCE=research`)**: the in-app `ExperimentRecord` — versions
        (v1, v2… with what changed, why, the trial count and the expectation FROZEN when each opened),
        every counted trial, every period with its frozen grading rule, forward result, expected-vs-actual
        and learning, the change-log, the post-mortem when buried, and the graduation PROPOSAL when one
        exists (human-gated). Constituent names are withheld pending RA review.


        Other sources serve the P0/P1 `ExperimentDetail`.'
      operationId: get_experiment_api_pathfinder_experiment__experiment_id__get
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          title: Experiment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExperimentRecord'
                - $ref: '#/components/schemas/ExperimentDetail'
                title: Response Get Experiment Api Pathfinder Experiment  Experiment Id  Get
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/experiments:
    get:
      tags:
      - Pathfinder
      summary: The edge-discovery pipeline
      description: 'Every experiment across the lifecycle. Dead experiments are listed, not hidden.


        **S2 (`KANIDA_PATHFINDER_SOURCE=research`)** serves the experiment REGISTRY as `ExperimentsResponse`:
        every experiment''s PUBLIC card (theme + evidence + the seven-line story — never a constituent,
        an entry, a target or a stop), the S1 findings the gate declined with their trial counts (`not_opened`),
        and the running experiment scoreboard (Right · Wrong · Inconclusive · n over graded periods, void
        apart, forward / backfilled split). Losers first: buried, then testing, proposed last.


        Other sources serve the P0/P1 `ExperimentListResponse`.'
      operationId: get_experiments_api_pathfinder_experiments_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExperimentStatus'
          - type: 'null'
          description: 'P0/P1 only: filter by lifecycle status. Omit for all.'
          title: Status
        description: 'P0/P1 only: filter by lifecycle status. Omit for all.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExperimentsResponse'
                - $ref: '#/components/schemas/ExperimentListResponse'
                title: Response Get Experiments Api Pathfinder Experiments Get
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/feed:
    get:
      tags:
      - Pathfinder
      summary: The clarity-first research feed for one close (S1)
      description: 'The after-close edition: findings ranked by usefulness, **clarity first** — `what_matters_now`
        holds the first two or three, `discoveries` the rest. There is **no minimum count and no padding**:
        an edition with four findings is a valid edition.


        Every finding was **computed before it was written** by a template from the question library and
        carries: a digit-free `narrative` whose numbers are `{{fact:<id>}}` references into `facts[]`;
        full `provenance` (evidence level, n, period, regime, comparison group, cost hurdle); a `grading_rule`
        **frozen at publication**; and its `grading` state (pending, or graded Right / Wrong / Inconclusive
        with the realised facts). `scoreboard` is the running public record with n.


        `date` selects an edition (YYYY-MM-DD); omit it for the latest. Research items only — no entry,
        target, stop or execution is ever implied.'
      operationId: get_feed_api_pathfinder_feed_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Edition close date, YYYY-MM-DD. Omit for the latest.
          title: Date
        description: Edition close date, YYYY-MM-DD. Omit for the latest.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/learnings:
    get:
      tags:
      - Pathfinder
      summary: What Pathfinder has learned, and what it is testing next
      description: '`learned[]` is what the agent now believes, each tied to the experiments and evidence
        that produced it and tagged with its learning level (L1 evidence, L2 parameter, L3 strategy —
        L4 Constitution changes are human-only and never authored here). `testing_next[]` is what it decided
        to test next and why now, including the ones that are blocked and why.'
      operationId: get_learnings_api_pathfinder_learnings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningsResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pathfinder/loop:
    get:
      tags:
      - Pathfinder
      summary: The live research loop, as a story
      description: 'One cycle of the loop: what the deterministic observer noticed, the hypothesis it
        justified waking the LLM for, the virtual experiment, what happened, what was learned and changed,
        and what is next — plus the supporting `facts` every narrative sentence references.


        **Every number in this payload originates in `facts[]`, computed by a deterministic engine.**
        LLM-authored story text contains no literal numerals; it carries `{{fact:<id>}}` references the
        client resolves against `facts[]`.'
      operationId: get_loop_api_pathfinder_loop_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Author:
      type: string
      enum:
      - engine
      - llm
      - human
      title: Author
    BasketView:
      properties:
        description:
          type: string
          title: Description
        constituents_visibility:
          type: string
          enum:
          - withheld_pending_ra_review
          - in_app_ra_reviewed
          title: Constituents Visibility
        ra_review_state:
          type: string
          title: Ra Review State
        constituents:
          items:
            type: string
          type: array
          title: Constituents
      additionalProperties: false
      type: object
      required:
      - description
      - constituents_visibility
      - ra_review_state
      title: BasketView
      description: Constituents only inside the app under RA review (addendum 6).
    ChangeLogEntry:
      properties:
        seq:
          type: integer
          minimum: 1.0
          title: Seq
        level:
          $ref: '#/components/schemas/LearningLevel'
        at:
          type: string
          format: date-time
          title: At
        what_changed:
          type: string
          title: What Changed
        why:
          type: string
          title: Why
        evidence_refs:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence Refs
        previous_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Version
          description: Null only for the very first version of a thing.
        new_version:
          type: string
          title: New Version
        performance_before:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        performance_after:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        improved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Improved
          description: null = not yet enough forward evidence to say. Never guessed.
        decided_by:
          $ref: '#/components/schemas/Author'
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
          description: Human approver, when required.
        constitution_version:
          type: string
          title: Constitution Version
        validation:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation
          description: 'For L3: how the new version was backtested AND forward-validated before replacing.'
      additionalProperties: false
      type: object
      required:
      - seq
      - level
      - at
      - what_changed
      - why
      - evidence_refs
      - new_version
      - decided_by
      - constitution_version
      title: ChangeLogEntry
      description: 'The governance record. Every change: what → why → evidence → previous version

        → new version → did performance improve. Also customer-facing copy.'
    ComparisonCategory:
      type: string
      enum:
      - stronger
      - weaker
      - inconclusive
      - failed
      - void
      - pending
      title: ComparisonCategory
      description: Expected vs actual, computed by the grader; the narrator may only repeat it.
    Confidence:
      type: string
      enum:
      - provisional
      - supported
      - strong
      title: Confidence
    DateRange:
      properties:
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
      additionalProperties: false
      type: object
      required:
      - start
      - end
      title: DateRange
    DeathCause:
      type: string
      enum:
      - no_edge_after_costs
      - not_implementable_under_cost_convention
      - not_distinguishable_from_chance
      - edge_did_not_persist_oos
      - sample_too_small
      - data_quality
      - regime_dependent_and_regime_gone
      - superseded_by_newer_version
      - revisions_exhausted
      - rule_stopped_firing
      title: DeathCause
    Decision:
      type: string
      enum:
      - virtual_long
      - virtual_short
      - watch
      - no_trade
      - new_experiment
      - continue
      - reject
      title: Decision
      description: The research decision vocabulary (pathfinder_demo.py). Research, never an order.
    Direction:
      type: string
      enum:
      - long
      - short
      title: Direction
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine code, e.g. 'not_found'.
        message:
          type: string
          title: Message
          description: Safe, human-readable. Never a stack trace or SQL.
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    Evidence:
      properties:
        id:
          type: string
          pattern: ^evd_[a-z0-9_]+$
          title: Id
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        title:
          type: string
          title: Title
        label:
          type: string
          title: Label
          description: The simulated or virtual-money honesty label.
        performance:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        fact_refs:
          items:
            type: string
          type: array
          title: Fact Refs
        provenance:
          $ref: '#/components/schemas/Provenance'
        interpretation:
          anyOf:
          - $ref: '#/components/schemas/StoryLine'
          - type: 'null'
          description: Optional LLM reading of THIS bundle. Subject to L-8.
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - title
      - label
      - provenance
      title: Evidence
      description: A deterministic evidence bundle the LLM may interpret (never produce).
    EvidenceKind:
      type: string
      enum:
      - historical_replay
      - forward_virtual
      - regime_split
      - cost_sensitivity
      - placebo
      - novelty_check
      title: EvidenceKind
    EvidenceLevel:
      type: string
      enum:
      - same_stock
      - peer_group
      - sector
      - whole_market
      title: EvidenceLevel
      description: 'S1 (spec addendum 7): where the evidence comes from. Stated on every fact and every

        finding so a reader never mistakes a whole-market base rate for a stock''s own history.'
    Expectation:
      properties:
        frozen_at:
          type: string
          format: date-time
          title: Frozen At
        seal:
          type: string
          format: date
          title: Seal
          description: Data seal the expectation was computed on. No later bar was visible.
        metric:
          type: string
          title: Metric
        expectancy_net_pct:
          type: number
          title: Expectancy Net Pct
          description: Mean net P&L per trade, winsorised, net of costs + slippage.
        expectancy_2x_slippage_net_pct:
          type: number
          title: Expectancy 2X Slippage Net Pct
        hit_rate_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Hit Rate Pct
          description: Supporting only — never the headline.
        median_net_pct:
          type: number
          title: Median Net Pct
        n:
          type: integer
          minimum: 1.0
          title: N
        signal_days:
          type: integer
          minimum: 1.0
          title: Signal Days
        period:
          $ref: '#/components/schemas/DateRange'
        trailing_expectancy_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Trailing Expectancy Net Pct
          description: The same on the trailing validation window alone.
        trailing_n:
          type: integer
          minimum: 0.0
          title: Trailing N
          default: 0
        trailing_period:
          anyOf:
          - $ref: '#/components/schemas/DateRange'
          - type: 'null'
        discovery_expectancy_2x_slippage_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Discovery Expectancy 2X Slippage Net Pct
          description: On the window ending at discovery_end alone, at twice the slippage (advisory).
        discovery_n:
          type: integer
          minimum: 0.0
          title: Discovery N
          default: 0
        edge_vs_baseline_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Edge Vs Baseline Pct
        baseline_n:
          type: integer
          minimum: 0.0
          title: Baseline N
          default: 0
        placebo_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Placebo P
        placebo_draws:
          type: integer
          minimum: 0.0
          title: Placebo Draws
          default: 0
        cluster_t:
          anyOf:
          - type: number
          - type: 'null'
          title: Cluster T
        hurdle_pct:
          type: number
          minimum: 0.0
          title: Hurdle Pct
        computed_by:
          type: string
          title: Computed By
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
        population:
          type: string
          title: Population
          description: 'N1: the population the expectation is measured on. The frozen expectation is the
            BOOK''s own — the trades the virtual book would have taken under its limits (liquidity rank,
            per-session cap, concurrency cap, one per symbol); the equal-weighted figure over every firing
            is `equal_weighted_expectancy_net_pct`, context only.'
          default: 'equal_weighted: every resolved signal, one unit each'
        signals_fired:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Signals Fired
          description: Every resolved firing of the rule on the window.
        signals_skipped:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Signals Skipped
          description: Firings the book's limits could not take.
        equal_weighted_expectancy_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Equal Weighted Expectancy Net Pct
          description: 'CONTEXT, not the expectation: the same rule over every firing equal-weighted (the
            S1 card''s population).'
        equal_weighted_n:
          type: integer
          minimum: 0.0
          title: Equal Weighted N
          default: 0
        top3_days_share_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Top3 Days Share Pct
          description: 'N3: share of the whole window''s net P&L carried by its three best signal days
            (defined when the total is positive).'
        expectancy_without_best_day_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Expectancy Without Best Day Net Pct
          description: 'N3: expectancy with the best signal day removed.'
        trailing_top3_days_share_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Trailing Top3 Days Share Pct
        trailing_expectancy_without_best_day_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Trailing Expectancy Without Best Day Net Pct
          description: 'N3: the trailing persistence check with its single best day removed.'
        placebo_convention:
          anyOf:
          - type: string
          - type: 'null'
          title: Placebo Convention
          description: 'N8: the statistic the placebo compares (winsorised on both sides).'
        placebo_se:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Placebo Se
          description: 'N8: binomial standard error of `placebo_p` at `placebo_draws`.'
        cluster_t_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Cluster T Kind
          description: 'N5: CR3 (small-cluster corrected), judged against Student''s t(G-1).'
      additionalProperties: false
      type: object
      required:
      - frozen_at
      - seal
      - metric
      - expectancy_net_pct
      - expectancy_2x_slippage_net_pct
      - hit_rate_pct
      - median_net_pct
      - n
      - signal_days
      - period
      - hurdle_pct
      - computed_by
      title: Expectation
      description: 'The historical expectation, recorded UP FRONT and never revised (spec: memory + versions).'
    ExpectedVsActual:
      properties:
        expected_net_pct:
          type: number
          title: Expected Net Pct
        actual_net_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Actual Net Pct
        gap_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Gap Pct
        category:
          $ref: '#/components/schemas/ComparisonCategory'
        statement:
          type: string
          title: Statement
          description: Digit-free engine sentence with {{fact:…}} tokens.
        fact_refs:
          items:
            type: string
          type: array
          title: Fact Refs
      additionalProperties: false
      type: object
      required:
      - expected_net_pct
      - category
      - statement
      title: ExpectedVsActual
    ExperimentBeat:
      type: string
      enum:
      - noticed
      - researched
      - history_showed
      - decided
      - happened
      - learned
      - next
      title: ExperimentBeat
      description: The seven-line customer narrative (docs/sessions/PATHFINDER.md), in order.
    ExperimentCard:
      properties:
        id:
          type: string
          pattern: ^exp_[a-z0-9_]+$
          title: Id
        opened_edition:
          type: string
          format: date
          title: Opened Edition
        news_edition:
          type: string
          format: date
          title: News Edition
          description: The edition this card's story was written on.
        state:
          $ref: '#/components/schemas/ExperimentState'
        family:
          type: string
          title: Family
        theme:
          type: string
          title: Theme
          description: Sector / theme in words. Never a name, never an instruction.
        source_finding_id:
          type: string
          pattern: ^fnd_[a-z0-9_]+$
          title: Source Finding Id
        evidence:
          $ref: '#/components/schemas/FindingProvenance'
        story:
          items:
            $ref: '#/components/schemas/ExperimentStoryLine'
          type: array
          maxItems: 7
          minItems: 7
          title: Story
        facts:
          items:
            $ref: '#/components/schemas/Fact'
          type: array
          minItems: 1
          title: Facts
        versions_count:
          type: integer
          minimum: 1.0
          title: Versions Count
        trials_total:
          type: integer
          minimum: 1.0
          title: Trials Total
          description: Every variant ever evaluated for this experiment.
        periods_graded:
          type: integer
          minimum: 0.0
          title: Periods Graded
        score:
          $ref: '#/components/schemas/ExperimentScoreCounts'
        latest_comparison:
          $ref: '#/components/schemas/ComparisonCategory'
        backfilled:
          type: boolean
          title: Backfilled
          description: 'Whether the edition this card was written on (`news_edition`) was generated after
            its session date. Per edition, like every S1 card (audit finding 1): a card can be forward
            while the experiment was opened in a backfill.'
        opened_backfilled:
          type: boolean
          title: Opened Backfilled
          description: Whether the experiment's OPENING edition was a backfill.
        record_label:
          type: string
          title: Record Label
        llm_provider:
          type: string
          title: Llm Provider
          default: none
        disclosure:
          type: string
          title: Disclosure
          default: Research experiment with virtual money — research validation, not advice and not a
            recommendation. Nothing here tells you when to enter, exit, or where to place a stop; constituent
            names appear only inside the app after Research Analyst review. Kanida never places an order
            on your behalf.
        family_trials_all_time:
          type: integer
          minimum: 0.0
          title: Family Trials All Time
          description: 'S2 re-audit N4: every trial this experiment''s FAMILY has ever had as of this
            card''s edition — across every finding, retry and revision — the count the family-wise significance
            bar divides by. Never restarts.'
          default: 0
      additionalProperties: false
      type: object
      required:
      - id
      - opened_edition
      - news_edition
      - state
      - family
      - theme
      - source_finding_id
