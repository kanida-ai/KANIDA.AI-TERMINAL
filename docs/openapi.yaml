openapi: 3.1.0
info:
  title: KANIDA.AI API
  version: 0.1.0
  description: 'The KANIDA.AI product contract — the seam between the engine track and the app track.


    Product laws that are enforced *in the schemas*, not merely documented:

    - **Expectancy is the hero metric**; `win_rate_pct` is optional and never the headline.

    - **Every return is paired with its drawdown** — a performance block cannot exist without `max_drawdown_pct`
    and `current_drawdown_pct`.

    - **No return promises and no target prices** — there is deliberately no target, projection or expected-return
    field anywhere in this contract.

    - **Every number carries n + date range + data source + cost convention** via `Provenance`; `sample_flag`
    is derived (`greyed` below n=20, `flagged` below n=50).

    - **Point-in-time is law** — every `Provenance` carries an `as_of`.

    - **Losers first** — ledgers are named `ledger_losers_first` and sorted ascending by net P&L.

    - **Backtests are labelled** ''Simulated · Not traded · Not PaRRVA-verified''.

    - **The LLM never calculates** — narrative text authored by a model contains no literal numerals,
    only `{{fact:<id>}}` references resolved against `facts[]`.'
paths:
  /api/pathfinder/experiment/{experiment_id}:
    get:
      tags:
      - Pathfinder
      summary: One experiment's full journey
      description: 'The whole story for a single experiment: the question, the deterministic rulebook,
        the six story beats, every supporting fact, the evidence bundles, the virtual book with its **losers-first**
        ledger, the append-only L1–L3 change-log (what changed → why → evidence → previous version → new
        version → did it improve), and — when the experiment died — its published post-mortem.'
      operationId: get_experiment_api_pathfinder_experiment__experiment_id__get
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          title: Experiment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetail'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/experiments:
    get:
      tags:
      - Pathfinder
      summary: The edge-discovery pipeline
      description: 'Every experiment across the lifecycle. Dead experiments are listed, not hidden.


        Ordering is **losers first**: struggling and dead experiments lead, promoted ones come last. `historical_return`
        and `virtual_return` are each a performance block that structurally pairs expectancy with drawdown;
        `sample_flag` is derived from `n` (`greyed` below 20, `flagged` below 50).'
      operationId: get_experiments_api_pathfinder_experiments_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExperimentStatus'
          - type: 'null'
          description: Filter by lifecycle status. Omit for all.
          title: Status
        description: Filter by lifecycle status. Omit for all.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentListResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/feed:
    get:
      tags:
      - Pathfinder
      summary: The clarity-first research feed for one close (S1)
      description: 'The after-close edition: findings ranked by usefulness, **clarity first** — `what_matters_now`
        holds the first two or three, `discoveries` the rest. There is **no minimum count and no padding**:
        an edition with four findings is a valid edition.


        Every finding was **computed before it was written** by a template from the question library and
        carries: a digit-free `narrative` whose numbers are `{{fact:<id>}}` references into `facts[]`;
        full `provenance` (evidence level, n, period, regime, comparison group, cost hurdle); a `grading_rule`
        **frozen at publication**; and its `grading` state (pending, or graded Right / Wrong / Inconclusive
        with the realised facts). `scoreboard` is the running public record with n.


        `date` selects an edition (YYYY-MM-DD); omit it for the latest. Research items only — no entry,
        target, stop or execution is ever implied.'
      operationId: get_feed_api_pathfinder_feed_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Edition close date, YYYY-MM-DD. Omit for the latest.
          title: Date
        description: Edition close date, YYYY-MM-DD. Omit for the latest.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pathfinder/learnings:
    get:
      tags:
      - Pathfinder
      summary: What Pathfinder has learned, and what it is testing next
      description: '`learned[]` is what the agent now believes, each tied to the experiments and evidence
        that produced it and tagged with its learning level (L1 evidence, L2 parameter, L3 strategy —
        L4 Constitution changes are human-only and never authored here). `testing_next[]` is what it decided
        to test next and why now, including the ones that are blocked and why.'
      operationId: get_learnings_api_pathfinder_learnings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningsResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pathfinder/loop:
    get:
      tags:
      - Pathfinder
      summary: The live research loop, as a story
      description: 'One cycle of the loop: what the deterministic observer noticed, the hypothesis it
        justified waking the LLM for, the virtual experiment, what happened, what was learned and changed,
        and what is next — plus the supporting `facts` every narrative sentence references.


        **Every number in this payload originates in `facts[]`, computed by a deterministic engine.**
        LLM-authored story text contains no literal numerals; it carries `{{fact:<id>}}` references the
        client resolves against `facts[]`.'
      operationId: get_loop_api_pathfinder_loop_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error (details are not disclosed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Author:
      type: string
      enum:
      - engine
      - llm
      - human
      title: Author
    ChangeLogEntry:
      properties:
        seq:
          type: integer
          minimum: 1.0
          title: Seq
        level:
          $ref: '#/components/schemas/LearningLevel'
        at:
          type: string
          format: date-time
          title: At
        what_changed:
          type: string
          title: What Changed
        why:
          type: string
          title: Why
        evidence_refs:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence Refs
        previous_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Version
          description: Null only for the very first version of a thing.
        new_version:
          type: string
          title: New Version
        performance_before:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        performance_after:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        improved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Improved
          description: null = not yet enough forward evidence to say. Never guessed.
        decided_by:
          $ref: '#/components/schemas/Author'
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
          description: Human approver, when required.
        constitution_version:
          type: string
          title: Constitution Version
        validation:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation
          description: 'For L3: how the new version was backtested AND forward-validated before replacing.'
      additionalProperties: false
      type: object
      required:
      - seq
      - level
      - at
      - what_changed
      - why
      - evidence_refs
      - new_version
      - decided_by
      - constitution_version
      title: ChangeLogEntry
      description: 'The governance record. Every change: what → why → evidence → previous version

        → new version → did performance improve. Also customer-facing copy.'
    Confidence:
      type: string
      enum:
      - provisional
      - supported
      - strong
      title: Confidence
    DateRange:
      properties:
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
      additionalProperties: false
      type: object
      required:
      - start
      - end
      title: DateRange
    DeathCause:
      type: string
      enum:
      - no_edge_after_costs
      - not_implementable_under_cost_convention
      - not_distinguishable_from_chance
      - edge_did_not_persist_oos
      - sample_too_small
      - data_quality
      - regime_dependent_and_regime_gone
      - superseded_by_newer_version
      title: DeathCause
    Decision:
      type: string
      enum:
      - virtual_long
      - virtual_short
      - watch
      - no_trade
      - new_experiment
      - continue
      - reject
      title: Decision
      description: The research decision vocabulary (pathfinder_demo.py). Research, never an order.
    Direction:
      type: string
      enum:
      - long
      - short
      title: Direction
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine code, e.g. 'not_found'.
        message:
          type: string
          title: Message
          description: Safe, human-readable. Never a stack trace or SQL.
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    Evidence:
      properties:
        id:
          type: string
          pattern: ^evd_[a-z0-9_]+$
          title: Id
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        title:
          type: string
          title: Title
        label:
          type: string
          title: Label
          description: The simulated or virtual-money honesty label.
        performance:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
        fact_refs:
          items:
            type: string
          type: array
          title: Fact Refs
        provenance:
          $ref: '#/components/schemas/Provenance'
        interpretation:
          anyOf:
          - $ref: '#/components/schemas/StoryLine'
          - type: 'null'
          description: Optional LLM reading of THIS bundle. Subject to L-8.
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - title
      - label
      - provenance
      title: Evidence
      description: A deterministic evidence bundle the LLM may interpret (never produce).
    EvidenceKind:
      type: string
      enum:
      - historical_replay
      - forward_virtual
      - regime_split
      - cost_sensitivity
      - placebo
      - novelty_check
      title: EvidenceKind
    EvidenceLevel:
      type: string
      enum:
      - same_stock
      - peer_group
      - sector
      - whole_market
      title: EvidenceLevel
      description: 'S1 (spec addendum 7): where the evidence comes from. Stated on every fact and every

        finding so a reader never mistakes a whole-market base rate for a stock''s own history.'
    ExperimentDetail:
      properties:
        id:
          type: string
          pattern: ^exp_[a-z0-9_]+$
          title: Id
        hypothesis:
          type: string
          title: Hypothesis
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        opened_at:
          type: string
          format: date-time
          title: Opened At
        strategy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy Version
        constitution_version:
          type: string
          title: Constitution Version
        historical_return:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
          description: Strategy-replay over the discovery window. Null while queued.
        virtual_return:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
          description: The forward virtual book. Null until the first closed trade.
        occurrences:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Occurrences
        n:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
        spark:
          anyOf:
          - $ref: '#/components/schemas/Spark'
          - type: 'null'
        as_of:
          type: string
          format: date-time
          title: As Of
        question:
          type: string
          title: Question
          description: The question the agent asked itself.
        rationale:
          type: string
          title: Rationale
        rulebook:
          $ref: '#/components/schemas/Rulebook'
        stage:
          $ref: '#/components/schemas/LoopStage'
        story:
          items:
            $ref: '#/components/schemas/StoryLine'
          type: array
          minItems: 1
          title: Story
          description: The loop story, in beat order.
        facts:
          items:
            $ref: '#/components/schemas/Fact'
          type: array
          title: Facts
          description: Every fact referenced anywhere in this payload.
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Evidence
        virtual_book:
          anyOf:
          - $ref: '#/components/schemas/VirtualBook'
          - type: 'null'
        change_log:
          items:
            $ref: '#/components/schemas/ChangeLogEntry'
          type: array
          title: Change Log
          description: Append-only L1–L3 history (an L4 change is recorded, never authored here).
        post_mortem:
          anyOf:
          - $ref: '#/components/schemas/PostMortem'
          - type: 'null'
        triggers:
          items:
            $ref: '#/components/schemas/Trigger'
          type: array
          title: Triggers
        llm_usage:
          anyOf:
          - $ref: '#/components/schemas/LlmUsage'
          - type: 'null'
        next_review:
          anyOf:
          - $ref: '#/components/schemas/Trigger'
          - type: 'null'
          description: The condition that will next wake the LLM for this experiment.
        disclosure:
          type: string
          title: Disclosure
          default: Pathfinder is a research lab. Everything here is a hypothesis under test with virtual
            money, not advice and not a recommendation. No returns are promised. Kanida never places an
            order on your behalf.
      additionalProperties: false
      type: object
      required:
      - id
      - hypothesis
      - status
      - opened_at
      - constitution_version
      - as_of
      - question
      - rationale
      - rulebook
      - stage
      - story
      - facts
      title: ExperimentDetail
      description: The full journey — this is the screen the whole product is about.
    ExperimentListResponse:
      properties:
        as_of:
          type: string
          format: date-time
          title: As Of
        status_filter:
          anyOf:
          - $ref: '#/components/schemas/ExperimentStatus'
          - type: 'null'
        count:
          type: integer
          minimum: 0.0
          title: Count
        items:
          items:
            $ref: '#/components/schemas/ExperimentSummary'
          type: array
          title: Items
        disclosure:
          type: string
          title: Disclosure
          default: Pathfinder is a research lab. Everything here is a hypothesis under test with virtual
            money, not advice and not a recommendation. No returns are promised. Kanida never places an
            order on your behalf.
      additionalProperties: false
      type: object
      required:
      - as_of
      - count
      - items
      title: ExperimentListResponse
    ExperimentStatus:
      type: string
      enum:
      - queued
      - testing
      - validating
      - promising
      - promoted
      - died
      title: ExperimentStatus
      description: The Pathfinder lifecycle. `died` is a first-class, published outcome.
    ExperimentSummary:
      properties:
        id:
          type: string
          pattern: ^exp_[a-z0-9_]+$
          title: Id
        hypothesis:
          type: string
          title: Hypothesis
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        opened_at:
          type: string
          format: date-time
          title: Opened At
        strategy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy Version
        constitution_version:
          type: string
          title: Constitution Version
        historical_return:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
          description: Strategy-replay over the discovery window. Null while queued.
        virtual_return:
          anyOf:
          - $ref: '#/components/schemas/PerformanceBlock'
          - type: 'null'
          description: The forward virtual book. Null until the first closed trade.
        occurrences:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Occurrences
        n:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
        spark:
          anyOf:
          - $ref: '#/components/schemas/Spark'
          - type: 'null'
        as_of:
          type: string
          format: date-time
          title: As Of
      additionalProperties: false
      type: object
      required:
      - id
      - hypothesis
      - status
      - opened_at
      - constitution_version
      - as_of
      title: ExperimentSummary
      description: List-row shape. The P0 brief's field list, made honest.
    Fact:
      properties:
        id:
          type: string
          pattern: ^fct_[a-z0-9_]+$
          title: Id
        label:
          type: string
          title: Label
          description: Human label, e.g. 'expectancy per trade, net of costs'.
        value:
          anyOf:
          - type: number
          - type: integer
          - type: string
          title: Value
        unit:
          $ref: '#/components/schemas/Unit'
        n:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N
          description: Sample size behind the number. Required for statistics.
        sample_flag:
          $ref: '#/components/schemas/SampleFlag'
          default: unknown
        provenance:
          $ref: '#/components/schemas/Provenance'
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - value
      - unit
      - provenance
      title: Fact
      description: 'A single deterministic number. THE ONLY PLACE A NUMBER MAY ORIGINATE.


        LLM prose references a fact by id; the client substitutes the rendered value.

        This is what makes "the LLM never calculates" machine-checkable.'
    FeedResponse:
      properties:
        edition_date:
          type: string
          format: date
          title: Edition Date
        data_as_of:
          type: string
          format: date
          title: Data As Of
          description: Last bar in the data the edition was computed on.
        generated_at:
          type: string
          format: date-time
          title: Generated At
        regime:
          type: string
          title: Regime
        universe_scanned:
          type: integer
          minimum: 0.0
          title: Universe Scanned
        candidates_considered:
          type: integer
          minimum: 0.0
          title: Candidates Considered
        published_count:
          type: integer
          minimum: 0.0
          title: Published Count
          description: NEW findings this edition. Can legitimately be small. Never padded.
        continued_count:
          type: integer
          minimum: 0.0
          title: Continued Count
          description: Continuations of open calls served alongside (not new publications).
          default: 0
        usefulness_threshold:
          type: number
          title: Usefulness Threshold
        what_matters_now:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: What Matters Now
          description: 'The first two or three: clarity in thirty seconds.'
        discoveries:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Discoveries
          description: 'Keep swiping: more high-quality findings.'
        scoreboard:
          $ref: '#/components/schemas/Scoreboard'
        llm_provider:
          type: string
          title: Llm Provider
          description: 'Who narrated: ''none'' means engine-templated.'
        disclosure:
          type: string
          title: Disclosure
          default: Pathfinder is a research lab. Everything here is a hypothesis under test with virtual
            money, not advice and not a recommendation. No returns are promised. Kanida never places an
            order on your behalf.
        backfilled:
          type: boolean
          title: Backfilled
          description: 'This edition was generated after its date: a simulated backfill.'
        record_label:
          type: string
          title: Record Label
          description: The label this edition is published under.
      additionalProperties: false
      type: object
      required:
      - edition_date
      - data_as_of
      - generated_at
      - regime
      - universe_scanned
      - candidates_considered
      - published_count
      - usefulness_threshold
      - what_matters_now
      - discoveries
      - scoreboard
      - llm_provider
      - backfilled
      - record_label
      title: FeedResponse
      description: GET /api/pathfinder/feed?date= — the clarity-first edition for one close.
    Finding:
      properties:
        id:
          type: string
          pattern: ^fnd_[a-z0-9_]+$
          title: Id
        edition_date:
          type: string
          format: date
          title: Edition Date
        rank:
          type: integer
          minimum: 1.0
          title: Rank
        tier:
          $ref: '#/components/schemas/Tier'
        template_id:
          type: string
          title: Template Id
        question:
          type: string
          title: Question
          description: The library question this card answers (engine text).
        subject:
          type: string
          title: Subject
        subject_kind:
          $ref: '#/components/schemas/SubjectKind'
        decision:
          $ref: '#/components/schemas/Decision'
        decision_reason:
          type: string
          title: Decision Reason
          description: Digit-free, engine-authored one-liner.
        narrative:
          $ref: '#/components/schemas/Narrative'
        facts:
          items:
            $ref: '#/components/schemas/Fact'
          type: array
          minItems: 1
          title: Facts
        key_fact_refs:
          items:
            type: string
          type: array
          title: Key Fact Refs
          description: The facts to render first.
        provenance:
          $ref: '#/components/schemas/FindingProvenance'
        grading_rule:
          $ref: '#/components/schemas/GradingRule'
        grading:
          $ref: '#/components/schemas/GradingState'
        usefulness:
